<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>D&D Character Sheet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Spectral:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --parchment: #fdfaf3; --ink: #1a1a1a; --dnd-red: #9b2226; }
        body { background: #1a1a1a; color: var(--ink); font-family: 'Spectral', serif; padding: 10px; }
        .sheet { background: var(--parchment); max-width: 950px; margin: 0 auto; padding: 15px; box-shadow: 0 0 60px rgba(0,0,0,0.8); border-radius: 4px; position: relative; }
        @media (min-width: 768px) { .sheet { padding: 25px; } }
        
        input, select, textarea { text-align: center; background: transparent !important; border: none !important; outline: none; width: 100%; }
        h3 { font-family: 'Marcellus', serif; font-size: 10px; text-transform: uppercase; font-weight: bold; text-align: center; border-top: 1px solid rgba(0,0,0,0.1); margin-top: 5px; }
        .dnd-border { border: 1px solid black; background: white; padding: 10px; position: relative; }
        
        .health-container { border: 2px solid black; background: white; border-radius: 8px; overflow: hidden; margin-bottom: 20px; }
        .hp-progress-bg { background: #eee; height: 14px; width: 100%; border-bottom: 1px solid black; position: relative; }
        .hp-fill { background: linear-gradient(90deg, #780000, #d00000); height: 100%; transition: width 0.4s ease; }
        .hp-temp-fill { background: #0077b6; height: 100%; position: absolute; top: 0; opacity: 0.5; transition: width 0.4s ease; }

        .stat-box { border: 2px solid black; border-radius: 10px 10px 30px 30px; text-align: center; width: 80px; background: white; margin-bottom: 10px; }
        .mod-val { font-size: 24px; font-weight: bold; }
        .base-val { border-top: 1px solid black !important; font-size: 12px; width: 45px !important; margin: 0 auto; }

        .dot { width: 12px; height: 12px; border: 1px solid black; border-radius: 50%; cursor: pointer; flex-shrink: 0; }
        .dot.active { background: black; }

        .slot-box { width: 14px; height: 14px; border: 1px solid black; border-radius: 2px; cursor: pointer; display: inline-block; margin-right: 3px; background: white; transition: background 0.2s; }
        .slot-box.used { background: var(--dnd-red); border-color: var(--dnd-red); }

        /* Modals */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center; padding: 15px; }
        .modal.flex { display: flex; }
        .modal-content { background: var(--parchment); padding: 20px; max-width: 500px; width: 100%; border: 3px solid black; box-shadow: 0 0 30px rgba(0,0,0,0.5); overflow-y: auto; max-height: 90vh; }
        
        .char-tab { padding: 6px 12px; border: 1px solid black; background: #ddd; cursor: pointer; border-radius: 8px 8px 0 0; font-family: 'Marcellus', serif; font-size: 10px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
        .char-tab.active { background: var(--parchment); border-bottom: 2px solid var(--parchment); font-weight: bold; }
        .add-char-btn { padding: 6px 15px; background: #222; color: #00ff88; border-radius: 8px 8px 0 0; font-weight: bold; cursor: pointer; border: 1px solid black; border-bottom: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        /* Edit/action buttons in lists */
        .item-edit-btn { color: #1d4ed8; cursor: pointer; font-size: 14px; padding: 0 4px; line-height: 1; flex-shrink: 0; }
        .item-del-btn  { color: #ef4444; cursor: pointer; font-size: 20px; padding: 0 4px; line-height: 1; flex-shrink: 0; }
        .item-name-btn { cursor: pointer; font-weight: bold; font-size: 11px; flex-grow: 1; text-align: left; }
        .item-name-btn:hover { color: #9b2226; }

        /* Auto-calc badge */
        .auto-badge { font-size: 9px; background: #d1fae5; color: #065f46; border: 1px solid #6ee7b7; border-radius: 3px; padding: 0 4px; margin-left: 4px; }

        /* Edit modal inputs */
        #edit-modal input, #edit-modal textarea, #edit-modal select {
            background: white !important;
            border: 1px solid #aaa !important;
            border-radius: 4px;
            padding: 4px 8px;
            text-align: left;
            width: 100%;
        }
    </style>
</head>
<body>

<!-- Cloud Management -->
<div class="max-w-[950px] mx-auto mb-4 p-3 bg-zinc-900 text-white rounded-lg flex flex-col sm:flex-row gap-3 text-[11px] items-center shadow-xl">
    <div class="flex flex-col gap-1 w-full sm:w-auto">
        <label class="uppercase font-bold text-zinc-400">Ключ ID (для хмари)</label>
        <input type="text" id="fb-key" placeholder="напр: my_party_2026" class="bg-zinc-800 text-white border border-zinc-700 !important w-full sm:w-48 text-left px-3 py-1.5 rounded focus:border-emerald-500">
    </div>
    <div class="flex gap-2 w-full sm:w-auto sm:ml-auto">
        <button onclick="window.cloudAction('SAVE')" class="flex-1 sm:flex-none bg-blue-700 hover:bg-blue-600 px-4 py-1.5 rounded font-bold uppercase transition">Зберегти</button>
        <button onclick="window.cloudAction('LOAD')" class="flex-1 sm:flex-none bg-emerald-700 hover:bg-emerald-600 px-4 py-1.5 rounded font-bold uppercase transition">Завантажити</button>
    </div>
</div>

<div class="max-w-[950px] mx-auto flex items-end gap-1 mb-[-1px] relative z-10 overflow-hidden">
    <div id="char-selector" class="flex items-end gap-1 overflow-x-auto no-scrollbar pb-1"></div>
    <button onclick="window.addNewChar()" class="add-char-btn shrink-0" title="Додати">+</button>
</div>

<div class="sheet">
    <!-- Header -->
    <header class="flex flex-col md:grid md:grid-cols-12 gap-4 border-b-2 border-black pb-4 mb-6">
        <div class="md:col-span-4 border-b md:border-none border-black/10 pb-2 md:pb-0">
            <input type="text" id="name" oninput="window.upd('name')" class="text-2xl md:text-3xl italic font-bold !text-left" placeholder="Ім'я">
            <span class="text-[9px] md:text-[10px] uppercase font-bold">Ім'я персонажа</span>
        </div>
        <div class="md:col-span-8 grid grid-cols-2 md:grid-cols-3 gap-2">
            <div class="border-b border-black"><input type="text" id="class_lvl" oninput="window.upd('class_lvl')" class="text-xs md:text-sm"><h3>Клас/Рівень</h3></div>
            <div class="border-b border-black"><input type="text" id="race" oninput="window.upd('race')" class="text-xs md:text-sm"><h3>Раса</h3></div>
            <div class="border-b border-black col-span-2 md:col-span-1"><input type="text" id="alignment" oninput="window.upd('alignment')" class="text-xs md:text-sm"><h3>Світогляд</h3></div>
        </div>
    </header>

    <!-- Health Section -->
    <div class="health-container shadow-md">
        <div class="hp-progress-bg"><div id="hp-bar-fill" class="hp-fill"></div><div id="hp-temp-fill-bar" class="hp-temp-fill"></div></div>
        <div class="flex flex-col md:grid md:grid-cols-12 p-2 md:p-3 items-center gap-4">
            <div class="flex w-full md:col-span-5 border-b md:border-b-0 md:border-r border-gray-200 pb-2 md:pb-0">
                <div class="flex-1 text-center">
                    <div class="flex items-center justify-center gap-1">
                        <input type="number" id="curHP" oninput="window.upd('curHP')" class="text-2xl md:text-3xl font-bold w-12 md:w-16">
                        <span class="text-xl text-gray-400">/</span>
                        <input type="number" id="maxHP" oninput="window.upd('maxHP')" class="text-lg md:text-xl font-bold w-12 md:w-16 text-gray-500">
                    </div>
                    <h3>HP</h3>
                </div>
                <div class="flex-1 text-center border-l border-gray-100">
                    <input type="number" id="tempHP" oninput="window.upd('tempHP')" class="text-2xl md:text-3xl font-bold text-blue-600">
                    <h3 class="text-blue-700 text-[8px] md:text-[10px]">Тимчасові</h3>
                </div>
            </div>
            
            <div class="w-full md:col-span-5 flex items-center justify-center gap-3">
                <button onclick="window.calcHP(-1)" class="w-10 h-10 md:w-12 md:h-12 bg-black text-white rounded-full font-bold text-xl">-</button>
                <input type="number" id="hp-input" placeholder="0" class="text-3xl md:text-4xl font-bold w-20 md:w-24 bg-gray-50 border border-gray-300 !important rounded">
                <button onclick="window.calcHP(1)" class="w-10 h-10 md:w-12 md:h-12 bg-red-800 text-white rounded-full font-bold text-xl">+</button>
            </div>

            <div class="w-full md:col-span-2 flex flex-row md:flex-col items-center justify-around md:justify-center border-t md:border-t-0 pt-2 md:pt-0">
                <button onclick="window.longRest()" class="text-[8px] border border-black px-2 py-1 uppercase font-bold">Відпочинок</button>
                <div class="flex items-center gap-2">
                    <div class="dot" id="insp-dot" onclick="window.tglInsp()"></div>
                    <span class="text-[9px] uppercase font-bold">Натхн.</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="flex border-b border-black/20 mb-4 md:mb-6 overflow-x-auto no-scrollbar">
        <div id="btn-p1" class="shrink-0 flex-1 p-2 md:p-3 text-center cursor-pointer font-bold border-b-2 text-xs md:text-sm" onclick="window.showPage(1)">СТАТИ</div>
        <div id="btn-p2" class="shrink-0 flex-1 p-2 md:p-3 text-center cursor-pointer font-bold border-b-2 text-xs md:text-sm" onclick="window.showPage(2)">МАГІЯ</div>
        <div id="btn-p3" class="shrink-0 flex-1 p-2 md:p-3 text-center cursor-pointer font-bold border-b-2 text-xs md:text-sm" onclick="window.showPage(3)">РЮКЗАК</div>
    </nav>

    <!-- Page 1: Stats -->
    <div id="page-1" class="page block">
        <div class="flex flex-col md:grid md:grid-cols-12 gap-4 md:gap-6">
            <div class="flex flex-wrap justify-center gap-2 md:col-span-2 md:flex-col" id="stats-container"></div>
            
            <div class="md:col-span-4 space-y-4">
                <div class="dnd-border text-center"><input type="number" id="prof" oninput="window.upd('prof')" class="text-xl font-bold"><h3>Майстерність</h3></div>
                <div class="dnd-border"><h3>Рятівні кидки</h3><div id="saves-list" class="grid grid-cols-2 md:grid-cols-1 gap-1 mt-2"></div></div>
                <div class="dnd-border"><h3>Навички</h3><div id="skills-list" class="grid grid-cols-1 gap-0.5 mt-2"></div></div>
            </div>

            <div class="md:col-span-6 space-y-4">
                <div class="grid grid-cols-3 gap-2">
                    <div class="dnd-border text-center"><input type="number" id="ac" oninput="window.upd('ac')" class="text-2xl md:text-3xl font-bold"><h3>КО</h3></div>
                    <div class="dnd-border text-center"><input type="number" id="init" oninput="window.upd('init')" class="text-2xl md:text-3xl font-bold"><h3>Ініц.</h3></div>
                    <div class="dnd-border text-center"><input type="number" id="speed" oninput="window.upd('speed')" class="text-2xl md:text-3xl font-bold"><h3>Шв.</h3></div>
                </div>
                <div class="dnd-border min-h-[200px] flex flex-col">
                    <h3>Зброя та Атаки</h3>
                    <div id="atk-list" class="space-y-1 my-2 flex-grow"></div>
                    <div class="flex flex-col gap-1 pt-2 border-t mt-auto bg-gray-50 p-2">
                        <div class="flex gap-1">
                            <input type="text" id="atk-n" placeholder="Зброя" class="text-xs border border-gray-300 !important px-1 w-1/2">
                            <input type="text" id="atk-d" placeholder="Опис" class="text-xs border border-gray-300 !important px-1 w-1/2">
                        </div>
                        <button onclick="window.addItem('attacks', 'atk')" class="bg-black text-white py-1.5 text-[10px] font-bold uppercase">Додати атаку</button>
                    </div>
                </div>
                <div class="dnd-border min-h-[200px] flex flex-col mt-4">
                    <h3>Риси та Особливості</h3>
                    <div id="traits-list" class="space-y-1 my-2 flex-grow"></div>
                    <div class="flex flex-col gap-1 pt-2 border-t mt-auto bg-gray-50 p-2">
                        <input type="text" id="trait-n" placeholder="Назва риси" class="text-xs border border-gray-300 !important px-1 w-full mb-1">
                        <textarea id="trait-d" placeholder="Опис..." class="text-xs border border-gray-300 !important px-1 w-full h-16 bg-white mb-1"></textarea>
                        <button onclick="window.addItem('traits', 'trait')" class="bg-black text-white py-1.5 text-[10px] font-bold uppercase">Додайте рису</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Page 2: Spells -->
    <div id="page-2" class="page hidden">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="dnd-border">
                <select id="spAbility" onchange="window.upd('spAbility')" class="font-bold text-base">
                    <option value="str">СИЛ</option>
                    <option value="dex">СПР</option>
                    <option value="con">ВИТ</option>
                    <option value="int">ІНТ</option>
                    <option value="wis">МДР</option>
                    <option value="cha">ХАР</option>
                </select>
                <h3>Хар-ка магії</h3>
            </div>
            <div class="dnd-border text-center">
                <div id="spDC-display" class="text-2xl font-bold"></div>
                <h3>Складність DC <span class="auto-badge">авто</span></h3>
            </div>
            <div class="dnd-border text-center">
                <div id="spBonus-display" class="text-2xl font-bold"></div>
                <h3>Бонус атаки <span class="auto-badge">авто</span></h3>
            </div>
        </div>
        <div id="spell-levels-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
        <div class="dnd-border mt-6 bg-zinc-50">
            <h3>Додати заклинання</h3>
            <div class="flex flex-col gap-2 mt-2 p-2">
                <div class="flex gap-2">
                    <select id="sp-lvl-sel" class="border border-black !important text-xs px-2 w-20">
                        <option value="0">Фокус</option>
                        <script>for(let i=1;i<=9;i++) document.write(`<option value="${i}">${i} рів.</option>`)</script>
                    </select>
                    <input type="text" id="sp-n" placeholder="Назва закляття" class="border border-gray-300 !important text-xs px-2 text-left w-full">
                </div>
                <textarea id="sp-d" placeholder="Опис..." class="border border-gray-300 !important text-xs p-2 text-left w-full h-16 bg-white"></textarea>
                <button onclick="window.addItem('spells', 'sp')" class="bg-black text-white py-2 text-[10px] font-bold uppercase">Зберегти закляття</button>
            </div>
        </div>
    </div>

    <!-- Page 3: Inventory -->
    <div id="page-3" class="page hidden">
        <div class="flex flex-col md:grid md:grid-cols-12 gap-4">
            <div class="flex gap-2 md:flex-col md:col-span-3">
                <div class="flex-1 dnd-border text-yellow-700"><h3>Золото</h3><input type="number" id="gp" oninput="window.upd('gp')" class="text-xl font-bold"></div>
                <div class="flex-1 dnd-border text-zinc-500"><h3>Срібло</h3><input type="number" id="sp-coin" oninput="window.updCoin('sp')" class="text-xl"></div>
                <div class="flex-1 dnd-border text-zinc-500"><h3>Мідь</h3><input type="number" id="cp" oninput="window.upd('cp')" class="text-xl"></div>
            </div>
            <div class="md:col-span-9 dnd-border min-h-[300px] flex flex-col">
                <h3>Рюкзак</h3>
                <div id="inv-list" class="p-2 space-y-1 flex-grow"></div>
                <div class="p-3 border-t bg-white flex flex-col gap-2">
                    <div class="flex gap-2">
                        <input type="text" id="it-n" placeholder="Предмет" class="w-1/3 border border-gray-300 !important px-2 text-left text-xs">
                        <input type="text" id="it-d" placeholder="Опис" class="w-2/3 border border-gray-300 !important px-2 text-left text-xs">
                    </div>
                    <button onclick="window.addItem('inventory', 'it')" class="bg-black text-white py-2 text-xs font-bold uppercase">Покласти в рюкзак</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- View Description Modal -->
<div id="desc-modal" class="modal" onclick="this.classList.remove('flex')">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h2 id="modal-title" class="text-xl md:text-2xl font-bold border-b-2 border-black mb-4 uppercase text-red-900"></h2>
        <p id="modal-body" class="text-base italic leading-relaxed whitespace-pre-wrap"></p>
        <button onclick="document.getElementById('desc-modal').classList.remove('flex')" class="mt-6 w-full bg-black text-white py-3 font-bold uppercase text-xs">Закрити</button>
    </div>
</div>

<!-- Edit Item Modal -->
<div id="edit-modal" class="modal" onclick="this.classList.remove('flex')">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h2 class="text-lg font-bold border-b-2 border-black mb-4 uppercase text-blue-900">✏️ Редагування</h2>
        <input type="hidden" id="edit-type">
        <input type="hidden" id="edit-index">
        <div class="flex flex-col gap-3">
            <div id="edit-lvl-row" class="hidden">
                <label class="text-xs uppercase font-bold block mb-1">Рівень заклинання</label>
                <select id="edit-lvl" class="w-full">
                    <option value="0">Фокус</option>
                    <script>for(let i=1;i<=9;i++) document.write(`<option value="${i}">${i} рівень</option>`)</script>
                </select>
            </div>
            <div>
                <label class="text-xs uppercase font-bold block mb-1">Назва</label>
                <input type="text" id="edit-name" placeholder="Назва">
            </div>
            <div>
                <label class="text-xs uppercase font-bold block mb-1">Опис</label>
                <textarea id="edit-desc" placeholder="Опис..." class="h-28 resize-y"></textarea>
            </div>
            <div class="flex gap-2 mt-2">
                <button onclick="window.saveEdit()" class="flex-1 bg-blue-800 text-white py-2 font-bold uppercase text-xs">Зберегти</button>
                <button onclick="document.getElementById('edit-modal').classList.remove('flex')" class="flex-1 bg-gray-400 text-white py-2 font-bold uppercase text-xs">Скасувати</button>
            </div>
        </div>
    </div>
</div>

<script>
    const DB_URL = "https://dndcharactersheet-7bcf2-default-rtdb.europe-west1.firebasedatabase.app/.json";

    const STATS = ["str", "dex", "con", "int", "wis", "cha"];
    const STAT_LABELS = {str:"СИЛ", dex:"СПР", con:"ВИТ", int:"ІНТ", wis:"МДР", cha:"ХАР"};
    const SKILLS = [
        {n:"Атлетика", s:"str"}, {n:"Акробатика", s:"dex"}, {n:"Спритність рук", s:"dex"}, {n:"Прихованість", s:"dex"},
        {n:"Магія", s:"int"}, {n:"Історія", s:"int"}, {n:"Аналіз", s:"int"}, {n:"Природа", s:"int"}, {n:"Релігія", s:"int"},
        {n:"Проникливість", s:"wis"}, {n:"Медицина", s:"wis"}, {n:"Уважність", s:"wis"}, {n:"Виживання", s:"wis"},
        {n:"Залякування", s:"cha"}, {n:"Обман", s:"cha"}, {n:"Виступ", s:"cha"}, {n:"Переконання", s:"cha"}
    ];

    const emptyChar = () => ({
        name: "Новий Герой", class_lvl: "", race: "", alignment: "",
        stats: {str:10, dex:10, con:10, int:10, wis:10, cha:10},
        profSaves: [], profSkills: [], inventory: [], spells: [], attacks: [], traits: [],
        prof: 2, ac: 10, init: 0, speed: 30, curHP: 10, maxHP: 10, tempHP: 0,
        gp: 0, sp: 0, cp: 0, spAbility: "int",
        spellConfig: [0,0,0,0,0,0,0,0,0],
        usedSlots: [[],[],[],[],[],[],[],[],[]]
    });

    let state = JSON.parse(localStorage.getItem('dnd_v5_local')) || { chars: [emptyChar()], activeChar: 0 };
    window.saveToStorage = () => localStorage.setItem('dnd_v5_local', JSON.stringify(state));

    // ── Helpers ────────────────────────────────────────────────────────────────

    function getMod(statVal) { return Math.floor(((parseInt(statVal) || 10) - 10) / 2); }

    function calcSpellStats(c) {
        const ability = c.spAbility || 'int';
        const mod = getMod(c.stats[ability]);
        const prof = parseInt(c.prof) || 0;
        const dc = 8 + prof + mod;
        const bonus = prof + mod;
        return { dc, bonus: (bonus >= 0 ? '+' : '') + bonus };
    }

    // ── Cloud ──────────────────────────────────────────────────────────────────

    window.cloudAction = async (type) => {
        const key = document.getElementById('fb-key').value.trim();
        if (!key) return alert("Введіть Ключ ID!");
        const url = DB_URL.replace(".json", `/${key}.json`);
        if (type === 'SAVE') {
            try {
                const res = await fetch(url, { method: 'PUT', body: JSON.stringify(state) });
                if (res.ok) alert("Дані збережено в хмарі!");
            } catch { alert("Помилка мережі"); }
        }
        if (type === 'LOAD') {
            try {
                const res = await fetch(url);
                const data = await res.json();
                if (data) {
                    data.chars = data.chars.map(c => ({ ...emptyChar(), ...c }));
                    state = data;
                    window.renderAll();
                    window.saveToStorage();
                    alert("Дані успішно завантажено!");
                } else alert("Нічого не знайдено за цим ID");
            } catch { alert("Помилка завантаження"); }
        }
    };

    // ── Spell slots ────────────────────────────────────────────────────────────

    window.tglSlot = (lvlIdx, slotIdx) => {
        const c = state.chars[state.activeChar];
        if (!c.usedSlots) c.usedSlots = [[],[],[],[],[],[],[],[],[]];
        if (!c.usedSlots[lvlIdx]) c.usedSlots[lvlIdx] = [];
        c.usedSlots[lvlIdx][slotIdx] = !c.usedSlots[lvlIdx][slotIdx];
        window.saveToStorage();
        window.renderAll();
    };

    window.updSpellCfg = (lvlIdx, val) => {
        state.chars[state.activeChar].spellConfig[lvlIdx] = parseInt(val) || 0;
        window.saveToStorage();
        window.renderAll();
    };

    // ── Long rest ──────────────────────────────────────────────────────────────

    window.longRest = () => {
        if (confirm("Відпочити? HP та комірки відновляться.")) {
            const c = state.chars[state.activeChar];
            c.curHP = c.maxHP;
            c.usedSlots = [[],[],[],[],[],[],[],[],[]];
            window.renderAll();
            window.saveToStorage();
        }
    };

    // ── Show desc modal (safe — reads from JS array, not HTML attributes) ──────

    window.showDesc = (type, index) => {
        const c = state.chars[state.activeChar];
        const item = c[type][index];
        if (!item) return;
        document.getElementById('modal-title').textContent = item.n;
        document.getElementById('modal-body').textContent = item.d || 'Немає опису...';
        document.getElementById('desc-modal').classList.add('flex');
    };

    // ── Edit modal ─────────────────────────────────────────────────────────────

    window.openEdit = (type, index) => {
        const c = state.chars[state.activeChar];
        const item = c[type][index];
        if (!item) return;
        document.getElementById('edit-type').value = type;
        document.getElementById('edit-index').value = index;
        document.getElementById('edit-name').value = item.n || '';
        document.getElementById('edit-desc').value = item.d || '';
        const lvlRow = document.getElementById('edit-lvl-row');
        if (type === 'spells') {
            lvlRow.classList.remove('hidden');
            document.getElementById('edit-lvl').value = item.l ?? 0;
        } else {
            lvlRow.classList.add('hidden');
        }
        document.getElementById('edit-modal').classList.add('flex');
    };

    window.saveEdit = () => {
        const type  = document.getElementById('edit-type').value;
        const index = parseInt(document.getElementById('edit-index').value);
        const c = state.chars[state.activeChar];
        c[type][index].n = document.getElementById('edit-name').value;
        c[type][index].d = document.getElementById('edit-desc').value;
        if (type === 'spells') c[type][index].l = document.getElementById('edit-lvl').value;
        document.getElementById('edit-modal').classList.remove('flex');
        window.renderAll();
        window.saveToStorage();
    };

    // ── Render ─────────────────────────────────────────────────────────────────

    window.renderAll = () => {
        const c = state.chars[state.activeChar];

        // Char tabs
        document.getElementById('char-selector').innerHTML = state.chars.map((ch, i) =>
            `<div class="char-tab ${i===state.activeChar?'active':''}" onclick="window.switchChar(${i})">
                ${ch.name || '---'}
                <span class="ml-2 text-red-500 font-bold px-1" onclick="window.delChar(${i}, event)">×</span>
            </div>`
        ).join('');

        // Simple fields
        ['name','class_lvl','race','alignment','prof','ac','init','speed','curHP','maxHP','tempHP','gp','cp'].forEach(f => {
            const el = document.getElementById(f);
            if (el) el.value = c[f] ?? '';
        });
        const spCoin = document.getElementById('sp-coin');
        if (spCoin) spCoin.value = c.sp ?? 0;

        // HP bar
        document.getElementById('hp-bar-fill').style.width = Math.min(100, ((c.curHP||0) / (c.maxHP||1)) * 100) + '%';

        // Spell ability selector
        const spAbilityEl = document.getElementById('spAbility');
        if (spAbilityEl) spAbilityEl.value = c.spAbility || 'int';

        // Auto spell DC & bonus
        const sp = calcSpellStats(c);
        const dcEl = document.getElementById('spDC-display');
        const bonusEl = document.getElementById('spBonus-display');
        if (dcEl) dcEl.textContent = sp.dc;
        if (bonusEl) bonusEl.textContent = sp.bonus;

        // Ability scores
        document.getElementById('stats-container').innerHTML = STATS.map(s => {
            const mod = getMod(c.stats[s]);
            return `<div class="stat-box">
                <h3>${STAT_LABELS[s]}</h3>
                <div class="mod-val">${mod>=0?'+':''}${mod}</div>
                <input type="number" value="${c.stats[s]}" oninput="window.updStat('${s}', this.value)" class="base-val">
            </div>`;
        }).join('');

        const p = parseInt(c.prof) || 0;

        // Saves
        document.getElementById('saves-list').innerHTML = STATS.map(s => {
            const isP = c.profSaves.includes(s);
            const mod = getMod(c.stats[s]) + (isP ? p : 0);
            return `<div class="flex items-center gap-2 cursor-pointer py-0.5" onclick="window.tglSave('${s}')">
                <div class="dot ${isP?'active':''}"></div>
                <span class="font-bold w-6 text-center text-[10px] border-b border-black/20">${mod>=0?'+':''}${mod}</span>
                <span class="uppercase text-[10px]">${STAT_LABELS[s]}</span>
            </div>`;
        }).join('');

        // Skills
        document.getElementById('skills-list').innerHTML = SKILLS.map(sk => {
            const isP = c.profSkills.includes(sk.n);
            const mod = getMod(c.stats[sk.s]) + (isP ? p : 0);
            return `<div class="flex items-center gap-2 cursor-pointer py-0.5" onclick="window.tglSkill('${sk.n}')">
                <div class="dot ${isP?'active':''}"></div>
                <span class="font-bold w-6 text-center text-[10px] border-b border-black/20">${mod>=0?'+':''}${mod}</span>
                <span class="text-[10px]">${sk.n}</span>
            </div>`;
        }).join('');

        // Generic list renderer — uses data-index, NO text in onclick
        const renderList = (list, containerId, type) => {
            const el = document.getElementById(containerId);
            if (!el) return;
            el.innerHTML = (list || []).map((item, i) =>
                `<div class="flex justify-between items-center border-b py-1 hover:bg-black/5 px-2 gap-1">
                    <span class="item-name-btn" data-type="${type}" data-index="${i}">${item.n}</span>
                    <div class="flex items-center shrink-0">
                        <span class="item-edit-btn" data-type="${type}" data-index="${i}" title="Редагувати">✏️</span>
                        <span class="item-del-btn" data-type="${type}" data-index="${i}" title="Видалити">×</span>
                    </div>
                </div>`
            ).join('');
        };

        renderList(c.attacks, 'atk-list', 'attacks');
        renderList(c.traits, 'traits-list', 'traits');
        renderList(c.inventory, 'inv-list', 'inventory');

        // Spell levels
        let spHtml = '';
        for (let i = 0; i <= 9; i++) {
            const lvlSpells = (c.spells || []).filter(s => parseInt(s.l) === i);
            const isNotCantrip = i > 0;
            const slotCount = isNotCantrip ? (c.spellConfig[i-1] || 0) : 0;
            let slotsHtml = '';
            if (isNotCantrip) {
                for (let s = 0; s < slotCount; s++) {
                    const isUsed = c.usedSlots[i-1] && c.usedSlots[i-1][s];
                    slotsHtml += `<div class="slot-box ${isUsed?'used':''}" onclick="window.tglSlot(${i-1}, ${s})"></div>`;
                }
            }
            spHtml += `<div class="dnd-border">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="border-none m-0">${i===0?'Фокуси':i+' Рівень'}</h3>
                    ${isNotCantrip ? `<div class="flex items-center gap-1">
                        <div class="flex flex-wrap max-w-[100px] justify-end">${slotsHtml}</div>
                        <input type="number" value="${slotCount}" oninput="window.updSpellCfg(${i-1}, this.value)" class="w-8 border-b border-black text-xs font-bold">
                    </div>` : ''}
                </div>
                <div class="text-[10px] space-y-1" data-spell-level="${i}">
                    ${lvlSpells.map(s => {
                        const idx = (c.spells || []).indexOf(s);
                        return `<div class="flex justify-between items-center border-b pb-1 gap-1">
                            <span class="item-name-btn flex-grow" data-type="spells" data-index="${idx}">${s.n}</span>
                            <div class="flex items-center shrink-0">
                                <span class="item-edit-btn" data-type="spells" data-index="${idx}" title="Редагувати">✏️</span>
                                <span class="item-del-btn" data-type="spells" data-index="${idx}" title="Видалити">×</span>
                            </div>
                        </div>`;
                    }).join('')}
                </div>
            </div>`;
        }
        document.getElementById('spell-levels-grid').innerHTML = spHtml;
    };

    // ── Event delegation for list buttons (no text in attributes = UA-safe) ───

    document.addEventListener('click', (e) => {
        const nameBtn = e.target.closest('.item-name-btn');
        const editBtn = e.target.closest('.item-edit-btn');
        const delBtn  = e.target.closest('.item-del-btn');

        if (nameBtn) {
            const { type, index } = nameBtn.dataset;
            window.showDesc(type, parseInt(index));
        }
        if (editBtn) {
            const { type, index } = editBtn.dataset;
            window.openEdit(type, parseInt(index));
        }
        if (delBtn) {
            const { type, index } = delBtn.dataset;
            if (confirm("Видалити цей елемент?")) {
                state.chars[state.activeChar][type].splice(parseInt(index), 1);
                window.renderAll();
                window.saveToStorage();
            }
        }
    });

    // ── Field updates ──────────────────────────────────────────────────────────

    window.upd = (f) => {
        const el = document.getElementById(f);
        if (!el) return;
        state.chars[state.activeChar][f] = el.value;
        window.saveToStorage();
        if (['name','curHP','maxHP','tempHP','prof','spAbility'].includes(f)) window.renderAll();
    };

    window.updCoin = (coin) => {
        state.chars[state.activeChar][coin] = document.getElementById('sp-coin').value;
        window.saveToStorage();
    };

    window.updStat = (k, v) => {
        state.chars[state.activeChar].stats[k] = parseInt(v) || 10;
        window.renderAll();
        window.saveToStorage();
    };

    window.tglSave = (k) => {
        const s = state.chars[state.activeChar].profSaves;
        state.chars[state.activeChar].profSaves = s.includes(k) ? s.filter(x=>x!==k) : [...s, k];
        window.renderAll(); window.saveToStorage();
    };

    window.tglSkill = (n) => {
        const s = state.chars[state.activeChar].profSkills;
        state.chars[state.activeChar].profSkills = s.includes(n) ? s.filter(x=>x!==n) : [...s, n];
        window.renderAll(); window.saveToStorage();
    };

    window.tglInsp = () => {
        const c = state.chars[state.activeChar];
        c.inspiration = !c.inspiration;
        document.getElementById('insp-dot').classList.toggle('active', !!c.inspiration);
        window.saveToStorage();
    };

    window.addItem = (type, pref) => {
        const nEl = document.getElementById(pref+'-n');
        const dEl = document.getElementById(pref+'-d');
        const n = nEl ? nEl.value.trim() : '';
        const d = dEl ? dEl.value.trim() : '';
        const l = (pref === 'sp') ? (document.getElementById('sp-lvl-sel')?.value || 0) : 0;
        if (!n) return;
        if (!state.chars[state.activeChar][type]) state.chars[state.activeChar][type] = [];
        state.chars[state.activeChar][type].push({ n, d, l });
        if (nEl) nEl.value = '';
        if (dEl) dEl.value = '';
        window.renderAll();
        window.saveToStorage();
    };

    window.calcHP = (dir) => {
        const c = state.chars[state.activeChar];
        const val = parseInt(document.getElementById('hp-input').value) || 0;
        c.curHP = dir === 1
            ? Math.min(parseInt(c.maxHP)||0, (parseInt(c.curHP)||0) + val)
            : Math.max(0, (parseInt(c.curHP)||0) - val);
        document.getElementById('hp-input').value = '';
        window.renderAll(); window.saveToStorage();
    };

    window.showPage = (p) => {
        document.querySelectorAll('.page').forEach(el => el.classList.add('hidden'));
        document.getElementById(`page-${p}`).classList.remove('hidden');
        [1,2,3].forEach(i => {
            const btn = document.getElementById(`btn-p${i}`);
            btn.classList.toggle('border-black', i === p);
            btn.classList.toggle('border-transparent', i !== p);
        });
    };

    window.switchChar = (i) => { state.activeChar = i; window.renderAll(); };

    window.addNewChar = () => {
        state.chars.push(emptyChar());
        state.activeChar = state.chars.length - 1;
        window.renderAll(); window.saveToStorage();
    };

    window.delChar = (i, e) => {
        e.stopPropagation();
        if (state.chars.length > 1 && confirm("Видалити персонажа повністю?")) {
            state.chars.splice(i, 1);
            state.activeChar = 0;
            window.renderAll(); window.saveToStorage();
        }
    };

    window.renderAll();
    window.showPage(1);
</script>
</body>
</html>
